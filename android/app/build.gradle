plugins {
    id 'com.android.application' version '8.13.2'
}

def localEmulator = providers.gradleProperty('localEmulator').orNull == 'true'

android {
    namespace 'com.sendsnippet.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sendsnippet.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
        buildConfigField 'boolean', 'LOCAL_EMULATOR', localEmulator.toString()
        buildConfigField 'String', 'BASE_URL', localEmulator
                ? '"http://10.0.2.2:5075"'
                : '"https://sendsnippet.web.app"'
    }
    buildTypes {
        debug {
            if (localEmulator) applicationIdSuffix '.dev'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
